<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduSchool Management</title>
<meta name="theme-color" content="#15345B">
<style>
:root{--navy:#15345B;--teal:#159A8A;--soft:#E8F5F1;--amber:#E8B44C;--bg:#F5F7FA;--card:#fff;--text:#263445;--line:#d9e0e8;--onnavy:#fff;--bad:#b3261e;--badbg:#fdecea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--navy:#8fb4e8;--teal:#3cc4b3;--soft:#12332f;--bg:#0f1722;--card:#18222f;--text:#e6ecf3;--line:#2b3a4c;--onnavy:#0f1722;--bad:#ff8a80;--badbg:#3a1d1b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,Manrope,"Nunito Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:520px;margin:auto;padding:16px}
h1{font-size:22px;line-height:1.25;margin:10px 0 4px;color:var(--navy)}h2{font-size:17px;margin:18px 0 8px;color:var(--navy)}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 14px}.logo b{font-size:19px;color:var(--navy);line-height:1.1}
.bar{display:flex;align-items:center;gap:10px;background:#15345B;color:#fff;padding:10px 14px}.bar div{flex:1;line-height:1.2}.bar small{display:block;opacity:.8;font-size:12px}
.bar button{height:40px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:14px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}.f{display:flex;gap:8px}
input,select{width:100%;height:48px;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit}input:focus,select:focus{outline:2px solid var(--teal)}
button.b{height:48px;border-radius:8px;border:0;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:14px;background:var(--navy);color:var(--onnavy)}button.b:disabled{opacity:.55}
button.s{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;height:48px;padding:0 14px;font-size:15px;cursor:pointer;white-space:nowrap}
button.l{background:none;border:0;color:var(--teal);font-size:15px;font-weight:600;padding:10px 0;cursor:pointer}
.err{color:var(--bad);background:var(--badbg);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:10px}.ok{background:var(--soft);border-left:4px solid var(--teal);border-radius:6px;padding:10px;font-size:14px;margin-top:10px}
.warn{background:var(--soft);border-left:4px solid var(--amber);border-radius:6px;padding:10px;font-size:14px;margin:10px 0}
.muted{font-size:14px;opacity:.8}.center{text-align:center}
.sch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.sch:last-child{border:0}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--teal)}.pill.p{background:#fff4d6;color:#8a5a00}.pill.x{background:var(--badbg);color:var(--bad)}
.sch button{height:40px;padding:0 12px;font-size:14px}
.menu{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--text);font-size:16px;cursor:pointer;min-height:56px;font-family:inherit}.menu b{color:var(--navy)}.menu small{display:block;opacity:.8}.go{color:var(--teal);font-weight:700}
fieldset{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:8px 12px}legend{font-weight:700;color:var(--navy);padding:0 6px;font-size:14px}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:16px;font-weight:400;margin:0}.chk input{width:22px;height:22px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.chip{background:var(--soft);color:var(--navy);border-radius:99px;padding:2px 10px;font-size:13px}
textarea{width:100%;min-height:110px;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit}textarea:focus{outline:2px solid var(--teal)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{border-collapse:collapse;width:100%}th,td{padding:6px;border-bottom:1px solid var(--line);font-size:14px;text-align:left;vertical-align:top}th{background:var(--soft);color:var(--navy)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}td input,td select{height:40px;font-size:15px;padding:0 8px}
.bad{color:var(--bad);font-size:13px}.wn{color:#8a5a00;font-size:13px}.okc{color:var(--teal);font-size:13px}.x{width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--bad);border-radius:8px;font-size:18px;cursor:pointer;padding:0}
.tabs{display:flex;gap:6px;margin:8px 0}.tab{flex:1;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}.tab[aria-pressed=true]{background:var(--navy);color:var(--onnavy);border-color:var(--navy)}
.sum{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;margin:6px 0 10px}
.rmx{border:0;background:none;color:var(--bad);font-size:18px;padding:0 0 0 6px;cursor:pointer;line-height:1}
input.sc{width:66px;height:46px;font-size:16px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:0 4px}input.sc:focus{outline:2px solid var(--teal)}input.sc.bad{border-color:var(--bad);background:var(--badbg)}input.sc:disabled{opacity:.7}
.sheet td:first-child,.sheet th:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:130px;border-right:1px solid var(--line)}.sheet th:first-child{background:var(--soft)}.sheet td,.sheet th{text-align:center}.sheet td:first-child,.sheet th:first-child{text-align:left}
.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin:8px 0}
footer{padding:12px;text-align:center;font-size:12px;opacity:.75;border-top:1px solid var(--line);background:var(--card)}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="mark" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#15345B"/><path d="M13 23Q23 18 32 24V47Q23 41 13 45Z" fill="#fff"/><path d="M51 23Q41 18 32 24V47Q41 41 51 45Z" fill="#159A8A"/><circle cx="32" cy="13" r="3.5" fill="#E8B44C"/></symbol></defs></svg>
<div id="bar"></div><main id="app"><p class="center muted">Loading…</p></main>
<footer>EduSchool Management · Simplifying School Management.<br>Developed by EduResearch Hub</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Public values only. The publishable key is safe in the browser; Row Level Security protects the data.
// NEVER put a service_role key or database password in this file.
const SB_URL='https://pbogzdahdwjfibgrbrwg.supabase.co';
const SB_KEY='sb_publishable_Ncj3CQEHigg3JIzfh6_h4Q_refsHHUf';
const ROLE={school_admin:'School Admin',principal:'Principal',vice_principal:'Vice Principal',headmaster:'Headmaster',headmistress:'Headmistress',exam_officer:'Examination Officer',teacher:'Teacher',parent:'Parent',student:'Student'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const mark=s=>`<svg width="${s}" height="${s}" role="img" aria-label="EduSchool logo"><use href="#mark"/></svg>`;
const friendly=e=>{const m=(e&&e.message)||'';
if(/invalid login/i.test(m))return'Wrong email or password.';
if(/not confirmed/i.test(m))return'Please confirm your email first. Check your inbox.';
if(/already (been )?registered/i.test(m))return'This email already has an account. Try logging in.';
if(/at least 6|password should/i.test(m))return'Password must be at least 6 characters.';
if(/rate limit|too many/i.test(m))return'Too many attempts. Please wait a few minutes.';
if(/fetch|network/i.test(m))return'No internet connection. Please try again.';
return m||'Something went wrong. Please try again.'};
let db=null;
try{db=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
function view(html,bar){$('bar').innerHTML=bar||'';$('app').innerHTML=html;window.scrollTo(0,0)}
const busy=(b,on,t)=>{b.disabled=on;if(t)b.textContent=on?'Please wait…':t};
const msg=(id,text,cls='err')=>{const el=$(id);el.className=cls;el.textContent=text;el.hidden=!text};
const head=`<div class="logo">${mark(48)}<b>EduSchool<br>Management</b></div>`;
const pw=(id)=>`<div class="f"><input id="${id}" type="password" autocomplete="current-password"><button type="button" class="s" data-show="${id}" aria-pressed="false" style="width:84px">Show</button></div>`;
function wireShow(){document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.show),s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show'})}

function login(note){view(`${head}<h1>Welcome to EduSchool Management</h1><p class="muted" style="margin:0">Manage academic records, student information and school activities with ease.</p>
<div class="card" style="margin-top:12px"><label for="em">Email</label><input id="em" type="email" autocomplete="username" inputmode="email">
<label for="pw">Password</label>${pw('pw')}<div id="m" class="err" hidden role="alert"></div>${note?`<div class="ok">${esc(note)}</div>`:''}
<button class="b" id="go">Log in</button><div class="center"><button class="l" id="fp">Forgot password?</button></div></div>
<div class="center"><button class="l" id="su">New here? Create an account</button></div>`);wireShow();
$('go').onclick=async()=>{const e=$('em').value.trim(),p=$('pw').value;msg('m','');
if(!e||!p)return msg('m','Enter your email and password.');
busy($('go'),true,'Log in');const{error}=await db.auth.signInWithPassword({email:e,password:p});busy($('go'),false,'Log in');
if(error)return msg('m',friendly(error));home()};
$('fp').onclick=()=>forgot();$('su').onclick=()=>signup()}

function signup(){view(`${head}<h1>Create an account</h1><div class="card"><label for="fn">Full name</label><input id="fn" autocomplete="name">
<label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email"><label for="pw">Password (6 or more characters)</label>${pw('pw')}
<div id="m" class="err" hidden role="alert"></div><button class="b" id="go">Create account</button></div><div class="center"><button class="l" id="bk">← Back to log in</button></div>`);wireShow();
$('bk').onclick=()=>login();
$('go').onclick=async()=>{const n=$('fn').value.trim(),e=$('em').value.trim(),p=$('pw').value;msg('m','');
if(!n||!e)return msg('m','Enter your name and email.');if(p.length<6)return msg('m','Password must be at least 6 characters.');
busy($('go'),true,'Create account');
const{data,error}=await db.auth.signUp({email:e,password:p,options:{data:{full_name:n},emailRedirectTo:location.href.split('#')[0]}});busy($('go'),false,'Create account');
if(error)return msg('m',friendly(error));
if(data.session)return home();login('Account created. Check your email to confirm it, then log in.')}}

function forgot(){view(`${head}<h1>Reset password</h1><div class="card"><label for="em">Your email</label><input id="em" type="email" inputmode="email">
<div id="m" class="err" hidden role="alert"></div><button class="b" id="go">Send reset link</button></div><div class="center"><button class="l" id="bk">← Back</button></div>`);
$('bk').onclick=()=>login();
$('go').onclick=async()=>{const e=$('em').value.trim();if(!e)return msg('m','Enter your email.');busy($('go'),true,'Send reset link');
const{error}=await db.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});busy($('go'),false,'Send reset link');
if(error)return msg('m',friendly(error));msg('m','If that email has an account, a reset link has been sent.','ok')}}

function recovery(){view(`${head}<h1>Choose a new password</h1><div class="card"><label for="pw">New password</label>${pw('pw')}<div id="m" class="err" hidden role="alert"></div><button class="b" id="go">Save password</button></div>`);wireShow();
$('go').onclick=async()=>{const p=$('pw').value;if(p.length<6)return msg('m','Password must be at least 6 characters.');busy($('go'),true,'Save password');
const{error}=await db.auth.updateUser({password:p});busy($('go'),false,'Save password');if(error)return msg('m',friendly(error));home()}}

const barHtml=(title,sub)=>`<div class="bar">${mark(34)}<div><b>${esc(title)}</b><small>${esc(sub)}</small></div><button id="out">Log out</button></div>`;
const wireOut=()=>{$('out').onclick=async()=>{await db.auth.signOut();login()}};

async function home(){
const{data:u}=await db.auth.getUser();const user=u&&u.user;if(!user)return login();
const{data:prof}=await db.from('profiles').select('full_name,is_super_admin').eq('id',user.id).maybeSingle();
const{data:mem,error:me}=await db.from('school_members').select('role,school_id,schools(name,status,ownership,levels)').eq('user_id',user.id).eq('active',true);
if(me)return view(`<div class="err">Could not load your account: ${esc(me.message)}</div>`);
const name=(prof&&prof.full_name)||user.email;
if(prof&&prof.is_super_admin)return superAdmin(name);
if(!mem||!mem.length)return noSchool(name);
const m=mem[0],s=m.schools||{};
if(m.role==='parent'&&s.status==='active')return parentHome({uid:user.id,uname:name});
if(m.role==='exam_officer'&&s.status==='active')return examHome({sid:m.school_id,name:s.name,uname:name,uid:user.id});
if(m.role==='teacher'&&s.status==='active')return teacherHome({sid:m.school_id,name:s.name,uname:name,uid:user.id});
if(m.role==='school_admin'&&s.status==='active')return adminHome({sid:m.school_id,name:s.name,uname:name,levels:s.levels||['nursery','primary'],ownership:s.ownership||'private'});
view(`<h1>${esc(ROLE[m.role]||m.role)} portal</h1><p class="muted" style="margin:0 0 10px">${esc(name)} · ${esc(s.name||'')}</p>
${s.status==='active'?`<div class="ok">Your school is active. Features for your role are being connected step by step.</div>`:`<div class="warn"><b>Waiting for approval.</b> Your school is ${esc(s.status||'pending')}. The platform owner must activate it before you can use it.</div>`}
<div class="card"><p class="muted" style="margin:0">Signed in securely. Next phases connect students, scores, results and report cards to this account.</p></div>`,
barHtml(s.name||'EduSchool',ROLE[m.role]||m.role));wireOut()}

function noSchool(name){view(`<h1>Welcome, ${esc(name)}</h1>
<div class="card"><h2 style="margin-top:0">Register your school</h2><p class="muted" style="margin:0">You will become the School Admin. The platform owner approves new schools.</p>
<label for="sn">School name</label><input id="sn">
<label for="so">Type of school</label><select id="so"><option value="private">Private school</option><option value="public">Public (government) school</option></select>
<label for="sty">What does your school run?</label><select id="sty"><option value="nps">Nursery and Primary only</option><option value="all">Nursery, Primary and Secondary</option><option value="sec">Secondary only (Junior and Senior)</option><option value="custom">Other (choose levels)</option></select>
<div id="cu" hidden><fieldset><legend>Levels</legend>${[['nursery','Nursery'],['primary','Primary'],['jss','Junior Secondary'],['sss','Senior Secondary']].map(l=>`<label class="chk"><input type="checkbox" class="lv" value="${l[0]}"> ${l[1]}</label>`).join('')}</fieldset></div>
<label for="sa">Address</label><input id="sa"><label for="sp">School phone</label><input id="sp" inputmode="tel"><label for="se">School email</label><input id="se" type="email">
<div id="m" class="err" hidden role="alert"></div><button class="b" id="go">Register school</button></div>
<div class="card"><h2 style="margin-top:0">Parent?</h2><p class="muted" style="margin:0">See your child’s published results. The school must confirm you first.</p><button class="b" id="pl">Link my child</button></div>
<div class="card"><p class="muted" style="margin:0">Teacher or head? Your school adds you. Ask the school administrator to add this email address.</p></div>`,barHtml('EduSchool','Account'));wireOut();
$('pl').onclick=()=>parentLink(name);
$('sty').onchange=()=>{$('cu').hidden=$('sty').value!=='custom'};
$('go').onclick=async()=>{const n=$('sn').value.trim();if(!n)return msg('m','Enter the school name.');
const P={nps:['nursery','primary'],all:['nursery','primary','jss','sss'],sec:['jss','sss']};
const lv=$('sty').value==='custom'?[...document.querySelectorAll('.lv')].filter(x=>x.checked).map(x=>x.value):P[$('sty').value];
if(!lv.length)return msg('m','Tick at least one level.');busy($('go'),true,'Register school');
const{error}=await db.rpc('register_school',{p_name:n,p_ownership:$('so').value,p_levels:lv,p_address:$('sa').value.trim()||null,p_phone:$('sp').value.trim()||null,p_email:$('se').value.trim()||null});
busy($('go'),false,'Register school');if(error)return msg('m',friendly(error));home()}}

async function superAdmin(name){
const{data:L,error}=await db.from('schools').select('id,name,school_type,status,created_at,ownership,levels').order('created_at',{ascending:false});
if(error)return view(`<div class="err">Could not load schools: ${esc(error.message)}</div>`);
const c=s=>L.filter(x=>x.status===s).length;
view(`<h1>Platform overview</h1><p class="muted" style="margin:0 0 10px">${esc(name)} · Super Admin</p>
<div class="card"><b>${L.length}</b> schools · <b>${c('pending')}</b> waiting · <b>${c('active')}</b> active · <b>${c('suspended')}</b> suspended</div>
<h2>Schools</h2><div class="card">${L.length?L.map(s=>`<div class="sch"><div><b>${esc(s.name)}</b><div class="muted">${s.ownership==='public'?'Public':'Private'} · ${esc(structLabel(s.levels))} · ${new Date(s.created_at).toLocaleDateString()}</div></div>
<div style="display:flex;gap:6px;align-items:center"><span class="pill ${s.status==='active'?'':s.status==='pending'?'p':'x'}">${esc(s.status)}</span>
${s.status!=='active'?`<button class="s" data-id="${s.id}" data-st="active">Activate</button>`:`<button class="s" data-id="${s.id}" data-st="suspended">Suspend</button>`}</div></div>`).join(''):'<p class="muted" style="margin:0">No schools registered yet.</p>'}</div>
<div id="m" class="err" hidden role="alert"></div>`,barHtml('EduSchool Management','Super Admin'));wireOut();
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{
if(b.dataset.st==='suspended'&&!confirm('Suspend this school? Its users will lose access until it is activated again.'))return;
b.disabled=true;const{error}=await db.from('schools').update({status:b.dataset.st}).eq('id',b.dataset.id);
if(error){b.disabled=false;return msg('m',friendly(error))}superAdmin(name)})}


// ===== School Admin: school setup =====
const LEVELS=[['Nursery','nursery',['Nursery 1','Nursery 2','Nursery 3']],['Primary','primary',[1,2,3,4,5,6].map(n=>'Primary '+n)],['Junior Secondary','jss',['JSS 1','JSS 2','JSS 3']],['Senior Secondary','sss',['SS 1','SS 2','SS 3']]];
const ALLC=LEVELS.flatMap(l=>l[2]);
const levelOf=n=>(LEVELS.find(l=>l[2].includes(n))||[0,'other'])[1];
const COMMON=['Mathematics','English Language','Basic Science','Social Studies','Civic Education','Computer Studies','Agricultural Science','Home Economics','Cultural and Creative Arts','Christian Religious Studies','Islamic Studies','Hausa Language','Physical and Health Education'];
const dupMsg=e=>/duplicate|unique/i.test((e&&e.message)||'')?'Some of these already exist.':friendly(e);
const menu=(id,t,sub)=>`<button class="menu" id="${id}"><span><b>${t}</b><small>${sub}</small></span><span class="go">Open</span></button>`;
async function count(t,sid){const r=await db.from(t).select('id',{count:'exact',head:true}).eq('school_id',sid);return r.count||0}
async function adminHome(c){
const[cl,sc,su,st]=await Promise.all(['classes','sections','subjects','students'].map(t=>count(t,c.sid)));
view(`<h1>School Admin portal</h1><p class="muted" style="margin:0 0 10px">${esc(c.uname)} · ${esc(c.name)}<br>${c.ownership==='public'?'Public':'Private'} school · ${esc(structLabel(c.levels))}</p>
<div class="card"><b>${cl}</b> classes · <b>${sc}</b> class arms · <b>${su}</b> subjects · <b>${st}</b> students</div>
${menu('gs','Set up school','Session, classes, class arms and subjects')}
${menu('ge','Add students','Paste a list or upload Excel/CSV')}${menu('gl','Students','Search and view enrolled students')}${menu('gt','Staff and leadership','Heads, principals, teachers, exam officers')}${menu('gk','Assign teachers','Give teachers their classes and subjects')}${menu('gr','Review results','Approve, return or publish score sheets')}${menu('gq','Parent requests','Confirm parents and share the school code')}
<div class="card"><p class="muted" style="margin:0">Next step being connected: report cards.</p></div>`,barHtml(c.name,'School Admin'));wireOut();
$('gs').onclick=()=>setup(c);$('ge').onclick=()=>enrol(c);$('gl').onclick=()=>studentList(c);$('gt').onclick=()=>staff(c);$('gk').onclick=()=>assign(c);$('gr').onclick=()=>examHome(c);$('gq').onclick=()=>parentRequests(c)}

async function setup(c,note){
const[ses,cls,sec,sub]=await Promise.all([
db.from('academic_sessions').select('id,name,is_current').eq('school_id',c.sid).order('name',{ascending:false}),
db.from('classes').select('id,name,level').eq('school_id',c.sid),
db.from('sections').select('id,name,class_id').eq('school_id',c.sid),
db.from('subjects').select('id,name').eq('school_id',c.sid).order('name')]);

// ===== Student list parser (same code as the tested parseStudents module) =====
// Turns pasted/uploaded student lists into records. Pure functions, no DOM.
const GENDER = { m: 'Male', male: 'Male', boy: 'Male', f: 'Female', female: 'Female', girl: 'Female' };
const HEAD = { name: /^(full\s*)?name|student|pupil/i, adm: /adm|reg|number|^no\.?$|^id$/i, gender: /gender|sex/i };

function splitCsvLine(line, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (ch === d && !q) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur); return out.map((x) => x.trim());
}
const titleCase = (s) => (s === s.toUpperCase() ? s.toLowerCase().replace(/(^|[\s-])([a-z])/g, (m, a, b) => a + b.toUpperCase()) : s);
const isPunct = (t) => /^[-–—|:;,.\/]+$/.test(t);

function delimiter(line) { for (const d of ['\t', '|', ';', ',']) if (line.includes(d)) return d; return null; }

function parseStudents(text) {
  const lines = String(text).replace(/\r/g, '').split('\n').map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const d0 = delimiter(lines[0]);
  let map = null, start = 0;
  if (d0) {
    const cells = splitCsvLine(lines[0], d0);
    const m = {};
    cells.forEach((c, i) => { for (const k of ['gender', 'adm', 'name']) if (m[k] === undefined && HEAD[k].test(c) && !/\d/.test(c)) { m[k] = i; break; } });
    if (m.name !== undefined && (m.adm !== undefined || m.gender !== undefined)) { map = m; start = 1; }
  }
  return lines.slice(start).map((raw) => {
    const line = raw.replace(/^\d+\s*[.)\-]\s+/, '');
    const d = delimiter(line);
    const cells = d ? splitCsvLine(line, d) : line.split(/\s+/);
    let name = '', adm = '', gender = '';
    if (map && d) {
      name = cells[map.name] || ''; adm = cells[map.adm] || ''; gender = GENDER[(cells[map.gender] || '').toLowerCase()] || '';
    } else {
      const parts = [];
      for (const c of cells.flatMap((x) => (d ? x.split(/\s+/) : [x]))) {
        if (!c || isPunct(c)) continue;
        const g = GENDER[c.toLowerCase().replace(/[.,]/g, '')];
        if (g && !gender) gender = g;
        else if (/\d/.test(c)) { if (!adm) adm = c; }
        else parts.push(c);
      }
      name = parts.join(' ');
    }
    name = titleCase(name.replace(/\s+/g, ' ').trim());
    return { name, adm: adm.trim(), gender };
  });
}

/** Adds issues. blocking = cannot enrol until fixed; warn = allowed but flagged. */
function flagRecords(records, existingAdms = []) {
  const seen = new Map();
  records.forEach((r) => { const a = r.adm.toLowerCase(); if (a) seen.set(a, (seen.get(a) || 0) + 1); });
  const ex = new Set(existingAdms.map((a) => a.toLowerCase()));
  return records.map((r) => {
    const blocking = [], warn = [];
    if (!r.name) blocking.push('Name missing');
    if (!r.adm) blocking.push('Admission no. missing');
    else if (seen.get(r.adm.toLowerCase()) > 1) blocking.push('Duplicate in this list');
    else if (ex.has(r.adm.toLowerCase())) blocking.push('Already enrolled');
    if (r.name && r.name.split(' ').length < 2) warn.push('Check name (one word)');
    if (!r.gender) warn.push('Gender missing');
    return { ...r, blocking, warn };
  });
}

/** Next free admission numbers, zero-padded to the width of the longest existing plain number. */
function fillAdmissions(records, existingAdms = []) {
  const used = new Set([...existingAdms, ...records.map((r) => r.adm)].filter(Boolean).map((a) => a.toLowerCase()));
  let n = 1;
  return records.map((r) => {
    if (r.adm) return r;
    while (used.has(String(n).padStart(3, '0'))) n++;
    const adm = String(n).padStart(3, '0'); used.add(adm); return { ...r, adm };
  });
}

const toC=n=>Math.round(Number(n)*100);
function rowCalc(comps,marks){let cents=0,miss=0,bad=[];for(const k of comps){const v=marks[k.key];if(v===undefined||v===null||String(v).trim()===''){miss++;continue}
const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<0||n>Number(k.max_score)){bad.push(k.key);continue}cents+=toC(n)}
return{total:(miss||bad.length)?null:cents/100,miss,bad}}
function rankPos(vals){const o=vals.map((v,i)=>[v,i]).filter(x=>x[0]!==null).sort((a,b)=>b[0]-a[0]),p=vals.map(()=>null);o.forEach((x,k)=>{p[x[1]]=k&&o[k-1][0]===x[0]?p[o[k-1][1]]:k+1});return p}
const ordn=n=>{if(n===null)return'–';const v=n%100;if(v>=11&&v<=13)return n+'th';return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th')};
const gradeOf=(t,bands)=>{const b=[...bands].sort((x,y)=>y.min_score-x.min_score).find(x=>t>=Number(x.min_score));return b?b.grade:'–'};

<div class="sum" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0">${[[avg??'–','Average'],[hi??'–','Highest'],[lo??'–','Lowest'],[pr===null?'–':pr+'%','Pass rate'],[ok.length+'/'+S.length,'Complete'],[miss,'Missing']].map(x=>`<div class="card" style="margin:0;text-align:center;padding:8px"><b style="font-size:18px;color:var(--navy)">${x[0]}</b><div class="muted" style="font-size:12px">${x[1]}</div></div>`).join('')}</div>
${fl.map(f=>`<div class="${f[0]==='x'?'err':'warn'}">${f[1]}</div>`).join('')}${note?`<div class="warn"><b>Last note:</b> ${esc(note)}</div>`:''}
<div class="wrap"><table class="sheet" style="min-width:${180+comps.length*70}px"><thead><tr><th>Student</th>${comps.map(k=>`<th>${esc(k.name)}<br><small>/${k.max_score}</small></th>`).join('')}<th>Total</th><th>Grade</th><th>Pos.</th></tr></thead><tbody>${S.map((x,i)=>`<tr><td>${esc(x.full_name)}</td>${comps.map(k=>`<td>${esc(M[x.id][k.key]??'–')}</td>`).join('')}<td><b>${R[i].total===null?'–':R[i].total}</b></td><td>${R[i].total===null?'–':gradeOf(R[i].total,bands)}</td><td>${ordn(pos[i])}</td></tr>`).join('')}</tbody></table></div>
<div class="card" style="margin-top:12px">${['draft','returned'].includes(st)?'<p style="margin:0">Waiting for the teacher to correct and submit.</p>':`<label for="cm">${st==='under_review'?'Comment (required to return)':'Reason (required to reopen)'}</label><textarea id="cm" placeholder="Write here"></textarea>
<div id="m" class="err" hidden role="alert"></div>${st==='under_review'?`<button class="b" id="ap" ${miss?'disabled':''}>Approve results</button><button class="s" id="rt" style="width:100%;margin-top:8px">Return for correction</button>`:''}${st==='approved'?'<button class="b" id="pb">Publish to parents</button>':''}${['approved','published'].includes(st)?'<button class="s" id="ro" style="width:100%;margin-top:8px">Reopen for review</button>':''}`}</div>`);
const go=async(status,need,okmsg,confirmText)=>{const n=$('cm')?$('cm').value.trim():'';if(need&&!n)return msg('m',need);if(confirmText&&!confirm(confirmText))return;
const x=await db.rpc('review_sheet',{p_sheet:id,p_status:status,p_note:n||null});if(x.error)return msg('m',friendly(x.error));examHome(c,filter,okmsg)};
if($('ap'))$('ap').onclick=()=>go('approved',null,r.label+' approved.','Approve these results?');
if($('rt'))$('rt').onclick=()=>go('returned','Write a comment so the teacher knows what to correct.',r.label+' returned to the teacher.');
if($('pb'))$('pb').onclick=()=>go('published',null,r.label+' published.','Publish? Parents will be able to see these results.');
if($('ro'))$('ro').onclick=()=>go('under_review','Give a reason for reopening. It is saved in the activity log.',r.label+' reopened for review.')}


// ===== Parent link requests (School Admin) =====
async function parentRequests(c,note){
const bar=barHtml(c.name,'School Admin');
const[sc,rq]=await Promise.all([db.from('schools').select('join_code').eq('id',c.sid).single(),db.rpc('school_guardian_requests',{p_school:c.sid})]);
const back=`<button class="l" id="bk">← Back</button><h1>Parent requests</h1>`;
if(rq.error){view(back+`<div class="err">${esc(rq.error.message)}</div><p class="muted">If this says the function does not exist, the database update 0007 has not been run yet.</p>`,bar);wireOut();$('bk').onclick=()=>adminHome(c);return}
const code=sc.data&&sc.data.join_code,L=rq.data||[];
view(back+`${note?`<div class="ok">${esc(note)}</div>`:''}<div id="m" class="err" hidden role="alert"></div>
<div class="card"><b>School code for parents</b><p style="font-size:28px;letter-spacing:3px;margin:6px 0;color:var(--navy);font-weight:700">${esc(code||'—')}</p><p class="muted" style="margin:0">Give this code to parents. They need it with their child’s admission number. You still confirm each request below.</p></div>
<h2>Waiting for your decision</h2>${L.length?L.map(x=>`<div class="card"><b>${esc(x.parent||'Parent')}</b><div class="muted">Phone ${esc(x.phone)} · Admission no. ${esc(x.adm)}</div>
<div style="margin:6px 0">${x.student?`Child: <b>${esc(x.student)}</b>${x['class']?' · '+esc(x['class']):''}`:'<span style="color:var(--bad)">No student has this admission number</span>'}</div>
<div class="two"><button class="s" data-no="${x.id}">Reject</button><button class="b" data-ok="${x.id}" style="margin:0" ${x.student?'':'disabled'}>Approve</button></div></div>`).join(''):'<p class="muted">No requests waiting.</p>'}
<div class="card"><p class="muted" style="margin:0">Only approve if you know this person is the child’s parent or guardian. Check the phone number against your records.</p></div>`,bar);wireOut();
$('bk').onclick=()=>adminHome(c);
const go=async(id,ok)=>{if(ok&&!confirm('Approve this parent for this child?'))return;const x=await db.rpc('decide_guardian',{p_request:id,p_approve:ok});if(x.error)return msg('m',friendly(x.error));parentRequests(c,ok?'Parent approved.':'Request rejected.')};
document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>go(b.dataset.ok,true));document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>go(b.dataset.no,false))}

// ===== Parent portal =====
function parentLink(name,note,back){
view(`<button class="l" id="bk">← Back</button><h1>Link your child</h1>${note?`<div class="ok">${esc(note)}</div>`:''}
<div class="card"><p class="muted" style="margin:0">Ask the school for its <b>school code</b>. Then enter your child’s admission number and your phone number. The school will confirm before you see anything.</p>
<label for="jc">School code</label><input id="jc" autocomplete="off" autocapitalize="characters" maxlength="10" placeholder="ABC123">
<label for="ad">Child’s admission number</label><input id="ad" autocomplete="off">
<label for="ph">Your phone number (the one the school has)</label><input id="ph" inputmode="tel" autocomplete="tel">
<div id="m" class="err" hidden role="alert"></div><button class="b" id="go">Send request to school</button></div>`,barHtml('EduSchool','Parent'));wireOut();
$('bk').onclick=()=>back?back():home();
$('go').onclick=async()=>{const jc=$('jc').value.trim(),ad=$('ad').value.trim(),ph=$('ph').value.trim();
if(!jc||!ad||!ph)return msg('m','Fill in all three boxes.');busy($('go'),true,'Send request to school');
const x=await db.rpc('request_child_link',{p_code:jc,p_adm:ad,p_phone:ph});busy($('go'),false,'Send request to school');
if(x.error)return msg('m',friendly(x.error));parentLink(name,'Request sent. The school will confirm it. Come back later and log in again.',back)}}

const PTOP={1:['#E8B44C','#15345B'],2:['#C5CDD6','#15345B'],3:['#9A5B24','#fff']};
async function parentHome(c){
const[ch,rq]=await Promise.all([db.rpc('parent_children'),db.from('guardian_requests').select('id,admission_no,status').eq('parent_id',c.uid).eq('status','pending')]);
const bar=barHtml('EduSchool','Parent');
if(ch.error)return view(`<div class="err">${esc(ch.error.message)}</div><p class="muted">If this says the function does not exist, the database update 0007 has not been run yet.</p>`,bar);
const L=ch.data||[],P=rq.data||[];
view(`<h1>My children</h1><p class="muted" style="margin:0 0 10px">${esc(c.uname)}</p>
${L.length?L.map((x,i)=>`<button class="menu" data-i="${i}"><span><b>${esc(x.name)}</b><small>${esc(x.class||'')} · ${esc(x.school)} · Adm. ${esc(x.admission_no)}</small></span><span class="go">Results</span></button>`).join(''):'<div class="warn">No child is linked yet.</div>'}
${P.map(x=>`<div class="card"><b>Admission no. ${esc(x.admission_no)}</b> <span class="pill p">Waiting for the school</span></div>`).join('')}
<button class="b" id="pl">Link another child</button>`,bar);wireOut();
$('pl').onclick=()=>parentLink(c.uname,null,()=>parentHome(c));
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>parentChild(c,L[+b.dataset.i]))}

async function parentChild(c,ch){
const bar=barHtml('EduSchool','Parent'),r=await db.rpc('parent_results',{p_student:ch.id});
const head=`<button class="l" id="bk">← My children</button><h1>${esc(ch.name)}</h1><p class="muted" style="margin:0 0 10px">${esc(ch.class||'')} · ${esc(ch.school)}</p>`;
if(r.error){view(head+`<div class="err">${esc(friendly(r.error))}</div>`,bar);wireOut();$('bk').onclick=()=>parentHome(c);return}
const T=r.data||[];
view(head+(T.length?T.map(t=>{const sm=t.summary,tp=sm&&PTOP[sm.position];return`<div class="card"><b style="color:var(--navy)">${esc(t.session)} · ${esc(t.term)}</b>
${tp?`<div style="background:${tp[0]};color:${tp[1]};border-radius:10px;padding:10px 12px;font-weight:700;margin:8px 0">Top performer: ${ordn(sm.position)} position in class</div>`:''}
${sm?`<div class="sum"><span><b>${ordn(sm.position)}</b> of ${sm.size}</span><span>Average <b>${sm.average}%</b></span><span>Total <b>${sm.total}</b></span></div>`:''}
<div class="wrap"><table class="sheet" style="min-width:${200+t.components.length*70}px"><thead><tr><th>Subject</th>${t.components.map(k=>`<th>${esc(k.name)}<br><small>/${k.max}</small></th>`).join('')}<th>Total</th><th>Grade</th><th>Pos.</th></tr></thead>
<tbody>${t.rows.map(x=>`<tr><td>${esc(x.subject)}</td>${t.components.map(k=>`<td>${esc(x.marks&&x.marks[k.key]!==undefined?x.marks[k.key]:'–')}</td>`).join('')}<td><b>${x.total===null?'–':x.total}</b></td><td><b>${esc(x.grade||'–')}</b></td><td>${x.position?ordn(x.position):'–'}</td></tr>`).join('')}</tbody></table></div></div>`}).join(''):`<div class="card" style="text-align:center"><b>Results not published yet</b><p class="muted">You will see ${esc(ch.name.split(' ')[0])}’s results here once the school publishes them.</p></div>`),bar);wireOut();
$('bk').onclick=()=>parentHome(c)}

(async function start(){
if(!db){view(`<div class="err">The app could not load its connection library. Check your internet and reload.</div>`);return}
db.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')recovery()});
const{data}=await db.auth.getSession();
if(location.hash.includes('type=recovery'))return;
data&&data.session?home():login()})();
</script></body></html>
